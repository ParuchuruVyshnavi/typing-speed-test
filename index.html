<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>

  <div class="auth-container">

    <div class="auth-box">

      <h1>Login</h1>

      <form id="loginForm">

        <input
          type="text"
          id="username"
          placeholder="Username"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>

      <p id="message"></p>

      <p class="link-text">
        Don't have an account?

        <a href="register.html">
          Register
        </a>
      </p>

    </div>

  </div>

  <script src="auth.js"></script>

</body>
</html>
